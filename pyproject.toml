[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name (what you `pip install`). The bare "polyflux" name is
# already claimed on PyPI, so we ship as "polyflux-client" — the import name
# stays `import polyflux` (see [tool.hatch.build] packages).
name = "polyflux-client"
version = "0.3.0"
description = "Official Python client for Polyflux — stream real-time Polymarket trades from the mempool over WebSocket."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polyflux" }]
keywords = [
    "polymarket", "websocket", "real-time", "trading-bot",
    "prediction-markets", "mempool", "market-data", "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Framework :: AsyncIO",
]
dependencies = [
    "websockets>=12.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://polyflux.io"
Documentation = "https://polyflux.io/blog"
Repository = "https://github.com/polyflux/polyflux-python"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["polyflux"]
